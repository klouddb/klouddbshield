# golangci-lint v2 config
version: "2"

run:
  tests: true

linters:
  default: none
  settings:
    staticcheck:
      # Leave existing sentences, package comments, underscored names, and receiver names alone.
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"
        - "-ST1016"
        - "-ST1020"
  enable:
    - misspell
    - staticcheck
    - govet
    - errcheck
    - unused

  exclusions:
    generated: lax
    # Unchecked Close, fmt writes, and os.Remove match the existing code.
    presets:
      - std-error-handling
    paths:
      - .*\.pb\.go

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  fix: false
  whole-files: false
