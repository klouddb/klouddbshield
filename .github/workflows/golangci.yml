name: Go Lint
on:
  push:
  pull_request:
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read
jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/klouddb/dpdpa_pii_db_scanner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare embedded frontend for lint
        run: rm -rf cmd/main-server/dist && cp -R front cmd/main-server/dist
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # A new branch push has before=0000…0. Comparing that SHA returns 404 and lint then sees no Go files.
          only-new-issues: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') }}
